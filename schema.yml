          type: integer
          readOnly: true
        late_minutes:
          type: integer
          readOnly: true
        overtime_minutes:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
        employee:
          type: integer
          readOnly: true
      required:
      - created_at
      - date
      - employee
      - employee_name
      - first_entry
      - id
      - last_exit
      - late_minutes
      - overtime_minutes
      - status
      - updated_at
      - worked_minutes
    Device:
      type: object
