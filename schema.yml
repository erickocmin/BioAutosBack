components:
  schemas:
    Almacen:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        codigo:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        activo:
          type: boolean
        sucursal:
          type: integer
      required:
      - codigo
      - created_at
      - id
      - nombre
      - sucursal
      - updated_at
    Arqueo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/ArqueoDetalle'
          readOnly: true
        total_contado:
          type: number
          format: double
          readOnly: true
        diferencia:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        fecha:
          type: string
          format: date
        total_arqueo:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        total_efectivo:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        cerrado_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sucursal:
          type: integer
          readOnly: true
        caja:
          type: integer
        cajero:
          type: integer
          readOnly: true
        cerrado_por:
          type: integer
          readOnly: true
          nullable: true
      required:
      - caja
      - cajero
      - cerrado_at
      - cerrado_por
      - created_at
      - detalles
      - diferencia
      - estado
      - fecha
      - id
      - sucursal
      - total_arqueo
      - total_contado
      - total_efectivo
      - updated_at
    ArqueoDetalle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero_linea:
          type: integer
          readOnly: true
        categoria:
          type: string
          maxLength: 40
        descripcion:
          type: string
          maxLength: 200
        importe:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        arqueo:
          type: integer
          readOnly: true
        forma_pago:
          type: integer
          nullable: true
      required:
      - arqueo
      - categoria
      - id
      - importe
      - numero_linea
    Caja:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        codigo:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 100
        activa:
          type: boolean
        sucursal:
          type: integer
      required:
      - codigo
      - created_at
      - id
      - nombre
      - sucursal
      - updated_at
    CierreDiario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        fecha:
          type: string
          format: date
        numero_deposito:
          type: string
          maxLength: 80
        importe_deposito:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        anulado:
          type: boolean
          readOnly: true
        sucursal:
          type: integer
        creado_por:
          type: integer
          readOnly: true
        arqueos:
          type: array
          items:
            type: integer
      required:
      - anulado
      - arqueos
      - creado_por
      - created_at
      - fecha
      - id
      - sucursal
      - updated_at
    DailyAttendance:
